<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merry Quizmas · TV</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.min.js" defer></script>
</head>
<body class="tv">
<canvas id="snow" aria-hidden="true"></canvas>
<header class="top" id="top"></header>
<main id="stage" class="stage" aria-live="polite"></main>
<footer class="foot">
  <div id="status" class="status"></div>
  <div class="foot-r">
    <span id="timer" class="timer" aria-hidden="true"></span>
    <button id="next" class="btn primary big" hidden>Next</button>
  </div>
</footer>
<dialog id="photodlg" class="dlg" aria-labelledby="photodlg-h">
  <form id="photoform">
    <h2 id="photodlg-h">Unlock the family photos</h2>
    <p class="muted">Enter the family photo password. This screen remembers it, so you only do this once.</p>
    <label for="photopass" class="sr">Password</label>
    <input id="photopass" type="password" autocomplete="off" spellcheck="false">
    <p class="err" id="photoerr" role="alert" hidden></p>
    <div class="row"><button class="btn primary" id="photook" type="submit">Unlock</button><button class="btn" type="button" id="photocancel">Cancel</button></div>
  </form>
</dialog>
<script type="module" src="tv.js"></script>
</body>
</html>
